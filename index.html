<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YOLO Object Detection — MLOps Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.25rem; font-weight: 600; color: #f1f5f9; }
    header span { font-size: 0.8rem; background: #3b82f6; color: #fff; padding: 2px 10px; border-radius: 999px; }

    .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

    /* URL Bar */
    .url-bar {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 28px;
    }
    .url-bar label { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 8px; }
    .url-row { display: flex; gap: 10px; }
    .url-row input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 10px 14px;
      color: #f1f5f9;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .url-row input:focus { border-color: #3b82f6; }
    .url-row input::placeholder { color: #475569; }
    .btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .btn:hover { background: #2563eb; }
    .btn:disabled { background: #475569; cursor: not-allowed; }
    .btn-predict {
      width: 100%;
      padding: 13px;
      font-size: 1rem;
      margin-top: 16px;
      border-radius: 10px;
    }

    .model-badge {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: #64748b;
    }
    .model-badge .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #475569;
      transition: background 0.3s;
    }
    .model-badge .dot.connected { background: #22c55e; }

    /* Main layout */
    .main { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 720px) { .main { grid-template-columns: 1fr; } }

    /* Upload panel */
    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
    }
    .panel h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-bottom: 16px; }

    .drop-zone {
      border: 2px dashed #334155;
      border-radius: 10px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #3b82f6;
      background: #1d3461;
    }
    .drop-zone .icon { font-size: 2.5rem; margin-bottom: 10px; }
    .drop-zone p { color: #64748b; font-size: 0.88rem; }
    .drop-zone p span { color: #3b82f6; text-decoration: underline; cursor: pointer; }
    #fileInput { display: none; }

    /* Image preview with canvas */
    .preview-wrap {
      position: relative;
      display: none;
      border-radius: 10px;
      overflow: hidden;
      background: #0f172a;
    }
    .preview-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }
    .preview-wrap canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* Results panel */
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .count-badge {
      background: #3b82f6;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 999px;
    }

    .detection-list { display: flex; flex-direction: column; gap: 10px; }

    .detection-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px 16px;
      border-left: 4px solid #3b82f6;
    }
    .detection-card .class-name {
      font-size: 1rem;
      font-weight: 600;
      text-transform: capitalize;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .confidence-bar-wrap {
      background: #1e293b;
      border-radius: 999px;
      height: 6px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .confidence-bar {
      height: 100%;
      border-radius: 999px;
      background: #3b82f6;
      transition: width 0.4s ease;
    }
    .confidence-label { font-size: 0.78rem; color: #94a3b8; margin-bottom: 6px; }
    .bbox-info { font-size: 0.75rem; color: #475569; font-family: monospace; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #475569;
    }
    .empty-state .icon { font-size: 2rem; margin-bottom: 8px; }

    .error-msg {
      background: #450a0a;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.85rem;
      margin-top: 12px;
    }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #ffffff40;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <h1>YOLO Object Detection</h1>
  <span>MLOps Demo</span>
</header>

<div class="container">

  <!-- URL Input -->
  <div class="url-bar">
    <label>Azure Container App URL</label>
    <div class="url-row">
      <input
        type="text"
        id="apiUrl"
        placeholder="https://ml-app.xxxxxx.eastus.azurecontainerapps.io"
        value=""
      />
      <button class="btn" onclick="connectToModel()">Connect</button>
    </div>
    <div class="model-badge">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Not connected — enter your URL and click Connect</span>
    </div>
  </div>

  <!-- Main Grid -->
  <div class="main">

    <!-- Left: Upload -->
    <div class="panel">
      <h2>Upload Image</h2>

      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="icon">🖼️</div>
        <p>Drop an image here or <span>browse</span></p>
        <p style="margin-top:6px; font-size:0.78rem;">JPG, PNG, WEBP supported</p>
      </div>

      <input type="file" id="fileInput" accept="image/*" onchange="handleFile(this.files[0])" />

      <div class="preview-wrap" id="previewWrap">
        <img id="previewImg" src="" alt="Preview" onload="onImageLoad()" />
        <canvas id="bboxCanvas"></canvas>
      </div>

      <button class="btn btn-predict" id="predictBtn" onclick="predict()" disabled>
        Run Prediction
      </button>
      <div id="errorMsg"></div>
    </div>

    <!-- Right: Results -->
    <div class="panel">
      <div class="results-header">
        <h2>Detections</h2>
        <span class="count-badge" id="countBadge" style="display:none">0</span>
      </div>
      <div id="detectionList">
        <div class="empty-state">
          <div class="icon">🔍</div>
          <p>Upload an image and run prediction<br>to see results here</p>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  const COLORS = [
    '#3b82f6','#22c55e','#f59e0b','#ef4444','#8b5cf6',
    '#06b6d4','#ec4899','#14b8a6','#f97316','#a855f7'
  ];

  const classColorMap = {};
  let colorIndex = 0;
  let selectedFile = null;
  let originalWidth = 0;
  let originalHeight = 0;

  function getColor(cls) {
    if (!classColorMap[cls]) {
      classColorMap[cls] = COLORS[colorIndex % COLORS.length];
      colorIndex++;
    }
    return classColorMap[cls];
  }

  function getBaseUrl() {
    return document.getElementById('apiUrl').value.trim().replace(/\/$/, '');
  }

  async function connectToModel() {
    const url = getBaseUrl();
    if (!url) return;

    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    dot.className = 'dot';
    text.textContent = 'Connecting...';

    try {
      const res = await fetch(`${url}/model-info`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      dot.className = 'dot connected';
      text.textContent = `Connected — Model: ${data.model} | Version: ${data.version} | Classes: ${data.num_classes}`;
      updatePredictBtn();
    } catch (e) {
      dot.className = 'dot';
      text.textContent = `Connection failed: ${e.message}`;
    }
  }

  function handleFile(file) {
    if (!file) return;
    selectedFile = file;

    const reader = new FileReader();
    reader.onload = (e) => {
      const img = document.getElementById('previewImg');
      img.src = e.target.result;
      document.getElementById('dropZone').style.display = 'none';
      document.getElementById('previewWrap').style.display = 'block';
      clearCanvas();
      clearResults();
    };
    reader.readAsDataURL(file);
    updatePredictBtn();
  }

  function onImageLoad() {
    const img = document.getElementById('previewImg');
    originalWidth = img.naturalWidth;
    originalHeight = img.naturalHeight;
    const canvas = document.getElementById('bboxCanvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
  }

  function updatePredictBtn() {
    const hasUrl = getBaseUrl().length > 0;
    const hasFile = selectedFile !== null;
    document.getElementById('predictBtn').disabled = !(hasUrl && hasFile);
  }

  async function predict() {
    const url = getBaseUrl();
    const btn = document.getElementById('predictBtn');
    const errDiv = document.getElementById('errorMsg');
    errDiv.innerHTML = '';

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Predicting...';

    const formData = new FormData();
    formData.append('file', selectedFile);

    try {
      const res = await fetch(`${url}/predict`, { method: 'POST', body: formData });
      if (!res.ok) throw new Error(`Server returned HTTP ${res.status}`);
      const data = await res.json();
      renderResults(data);
      drawBoundingBoxes(data.detections);
    } catch (e) {
      errDiv.innerHTML = `<div class="error-msg">❌ ${e.message}. Check the URL and make sure the container is running.</div>`;
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Run Prediction';
    }
  }

  function drawBoundingBoxes(detections) {
    const canvas = document.getElementById('bboxCanvas');
    const img = document.getElementById('previewImg');
    const ctx = canvas.getContext('2d');

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const scaleX = canvas.width / originalWidth;
    const scaleY = canvas.height / originalHeight;

    detections.forEach((det) => {
      const [x1, y1, x2, y2] = det.bbox_xyxy;
      const color = getColor(det.class);
      const sx1 = x1 * scaleX;
      const sy1 = y1 * scaleY;
      const sw  = (x2 - x1) * scaleX;
      const sh  = (y2 - y1) * scaleY;

      // Box
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.strokeRect(sx1, sy1, sw, sh);

      // Label background
      const label = `${det.class} ${(det.confidence * 100).toFixed(1)}%`;
      ctx.font = 'bold 14px sans-serif';
      const textW = ctx.measureText(label).width;
      ctx.fillStyle = color;
      ctx.fillRect(sx1, sy1 - 22, textW + 10, 22);

      // Label text
      ctx.fillStyle = '#ffffff';
      ctx.fillText(label, sx1 + 5, sy1 - 6);
    });
  }

  function renderResults(data) {
    const list = document.getElementById('detectionList');
    const badge = document.getElementById('countBadge');

    if (!data.detections || data.detections.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="icon">😶</div><p>No objects detected.<br>Try a different image.</p></div>';
      badge.style.display = 'none';
      return;
    }

    badge.textContent = data.detections.length;
    badge.style.display = 'inline-block';

    list.innerHTML = data.detections.map((det, i) => {
      const color = getColor(det.class);
      const pct = (det.confidence * 100).toFixed(1);
      const [x1, y1, x2, y2] = det.bbox_xyxy;
      return `
        <div class="detection-card" style="border-left-color: ${color}">
          <div class="class-name">
            <span style="width:12px;height:12px;border-radius:3px;background:${color};display:inline-block;"></span>
            ${det.class}
          </div>
          <div class="confidence-label">Confidence: ${pct}%</div>
          <div class="confidence-bar-wrap">
            <div class="confidence-bar" style="width:${pct}%; background:${color}"></div>
          </div>
          <div class="bbox-info">
            Box: [${x1}, ${y1}] → [${x2}, ${y2}]
            &nbsp;|&nbsp; W: ${(x2-x1).toFixed(0)}px &nbsp;H: ${(y2-y1).toFixed(0)}px
          </div>
        </div>
      `;
    }).join('');
  }

  function clearCanvas() {
    const canvas = document.getElementById('bboxCanvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function clearResults() {
    document.getElementById('detectionList').innerHTML = `
      <div class="empty-state">
        <div class="icon">🔍</div>
        <p>Upload an image and run prediction<br>to see results here</p>
      </div>`;
    document.getElementById('countBadge').style.display = 'none';
    document.getElementById('errorMsg').innerHTML = '';
  }

  // Drag and drop
  const dropZone = document.getElementById('dropZone');
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) handleFile(file);
  });

  document.getElementById('apiUrl').addEventListener('input', updatePredictBtn);
  document.getElementById('apiUrl').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') connectToModel();
  });
</script>

</body>
</html>
